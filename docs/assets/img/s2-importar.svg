<text x="724" y="158" class="m" text-anchor="end" style="fill:#b86e00;font-size:11.5px">&lt;lgl&gt;</text>
<text x="380" y="240" class="t" text-anchor="middle" style="font-size:14px;">Auditar antes de confiar:</text>
