<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Tabla de decisión: para contar por categoría, geom_bar; para la distribución de un monto, geom_histogram; para comparar un monto entre grupos, geom_boxplot; para relacionar dos variables numéricas, geom_point; para la evolución en el tiempo, geom_line.">
<title>Tabla de decisión: para contar por categoría, geom_bar; para la distribución de un monto, geom_histogram; para comparar un monto entre grupos, geom_boxplot; para relacionar dos variables numéricas, geom_point; para la evolución en el tiempo, geom_line.</title>
<style>
  text { font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', Arial, sans-serif; font-size: 14px; fill: #111a30; }
  .t { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 16px; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .s { font-size: 12px; fill: #56607a; }
  .b { font-weight: 700; }
  .w { fill: #ffffff; }
  .cw { fill: #edf1fa; }
  .ln { stroke: #56607a; stroke-width: 1.6; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56607a"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138a5e"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9403f"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8f84"/></marker><marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fd1"/></marker></defs>
<text x="20" y="28" class="t">La pregunta decide la geom</text>
<rect x="20" y="46" width="290" height="42" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="34" y="72" class="b" style="font-size:13.5px;">¿Cuántos hay por categoría?</text>
<path d="M312 67 H 346" fill="none" stroke="#56607a" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="350" y="46" width="170" height="42" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2"/>
<text x="435" y="72" class="s" text-anchor="middle">1 categórica</text>
<path d="M522 67 H 556" fill="none" stroke="#b86e00" stroke-width="1.8" marker-end="url(#pa)"/>
<rect x="560" y="46" width="180" height="42" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="650" y="72" class="m b" text-anchor="middle">geom_bar()</text>
<rect x="20" y="100" width="290" height="42" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="34" y="126" class="b" style="font-size:13.5px;">¿Cómo se reparte un monto?</text>
<path d="M312 121 H 346" fill="none" stroke="#56607a" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="350" y="100" width="170" height="42" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2"/>
<text x="435" y="126" class="s" text-anchor="middle">1 numérica</text>
<path d="M522 121 H 556" fill="none" stroke="#b86e00" stroke-width="1.8" marker-end="url(#pa)"/>
<rect x="560" y="100" width="180" height="42" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="650" y="126" class="m b" text-anchor="middle">geom_histogram()</text>
<rect x="20" y="154" width="290" height="42" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="34" y="180" class="b" style="font-size:13.5px;">¿Qué grupo gana más?</text>
<path d="M312 175 H 346" fill="none" stroke="#56607a" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="350" y="154" width="170" height="42" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2"/>
<text x="435" y="180" class="s" text-anchor="middle">numérica + categórica</text>
<path d="M522 175 H 556" fill="none" stroke="#b86e00" stroke-width="1.8" marker-end="url(#pa)"/>
<rect x="560" y="154" width="180" height="42" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="650" y="180" class="m b" text-anchor="middle">geom_boxplot()</text>
<rect x="20" y="208" width="290" height="42" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="34" y="234" class="b" style="font-size:13.5px;">¿Se mueven juntas dos variables?</text>
<path d="M312 229 H 346" fill="none" stroke="#56607a" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="350" y="208" width="170" height="42" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2"/>
<text x="435" y="234" class="s" text-anchor="middle">2 numéricas</text>
<path d="M522 229 H 556" fill="none" stroke="#b86e00" stroke-width="1.8" marker-end="url(#pa)"/>
<rect x="560" y="208" width="180" height="42" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="650" y="234" class="m b" text-anchor="middle">geom_point()</text>
<rect x="20" y="262" width="290" height="42" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="34" y="288" class="b" style="font-size:13.5px;">¿Cómo evolucionó en el tiempo?</text>
<path d="M312 283 H 346" fill="none" stroke="#56607a" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="350" y="262" width="170" height="42" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2"/>
<text x="435" y="288" class="s" text-anchor="middle">tiempo + numérica</text>
<path d="M522 283 H 556" fill="none" stroke="#b86e00" stroke-width="1.8" marker-end="url(#pa)"/>
<rect x="560" y="262" width="180" height="42" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="650" y="288" class="m b" text-anchor="middle">geom_line()</text>
</svg>
