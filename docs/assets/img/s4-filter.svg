<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Una tabla de seis empresas entra a filter con la condición sector igual a industria y empleados mayor o igual a 90; solo pasan Textiles del Norte y Metalúrgica Istmo, las demás filas quedan tachadas. Las columnas no cambian.">
