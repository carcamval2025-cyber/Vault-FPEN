<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Tres capas que se suman con más: ggplot con los datos salarios da un lienzo vacío; aes con x igual a educación e y igual a salario agrega los ejes; geom_point dibuja un punto por persona.">
