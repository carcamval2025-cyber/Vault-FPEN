<text x="230" y="220" class="m" text-anchor="middle">4410</text>
<rect x="308" y="190" width="124" height="50" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.5"/>
<text x="370" y="220" class="m" text-anchor="middle">4777.5</text>
<rect x="448" y="190" width="124" height="50" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.5"/>
<text x="510" y="220" class="m" text-anchor="middle">4305</text>
<rect x="588" y="190" width="124" height="50" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.5"/>
<text x="650" y="220" class="m" text-anchor="middle">5040</text>
<text x="30" y="222" class="m b" style="fill:#b86e00;font-size:13px">ingresos * 1.05</text>
<text x="379" y="276" class="s" text-anchor="middle">El resultado tiene el mismo largo: 4 valores, no un total.</text>
</svg>
