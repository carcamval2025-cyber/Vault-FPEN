          <title id="v2title">Operación Vectorizada en R — Todo a la Vez</title>
          <desc id="v2desc">Cuatro flechas verticales paralelas aplican la misma operación por 1.05 simultáneamente a los 4 elementos de un vector, produciendo un vector resultado.</desc>
