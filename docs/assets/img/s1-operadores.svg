<rect x="510" y="46" width="170" height="56" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.5"/>
<text x="595" y="71" class="m b" text-anchor="middle">1100</text>
<text x="595" y="89" class="s" text-anchor="middle">utilidad</text>
