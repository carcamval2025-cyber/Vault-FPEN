<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Arriba, aritmética: ingresos_enero 4200 menos costos_enero 3100 da utilidad 1100. Abajo, comparación: utilidad 1100 mayor que 0 da TRUE.">
<title>Arriba, aritmética: ingresos_enero 4200 menos costos_enero 3100 da utilidad 1100. Abajo, comparación: utilidad 1100 mayor que 0 da TRUE.</title>
<style>
