<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Un vector de ventas con los valores 465, NA y 185. sum de ventas da NA porque el desconocido contagia el resultado. sum con na.rm igual a TRUE da 650, la suma de los valores conocidos. is.na de ventas da FALSE, TRUE, FALSE y sum de is.na da 1 faltante.">
<title>Un vector de ventas con los valores 465, NA y 185. sum de ventas da NA porque el desconocido contagia el resultado. sum con na.rm igual a TRUE da 650, la suma de los valores conocidos. is.na de ventas da FALSE, TRUE, FALSE y sum de is.na da 1 faltante.</title>
<style>
  text { font-family: 'Schibsted Grotesk', Arial, sans-serif; font-size: 14px; fill: #111a30; }
  .t { font-family: 'Schibsted Grotesk', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 16px; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .s { font-size: 12px; fill: #56607a; }
  .b { font-weight: 700; }
  .w { fill: #ffffff; }
  .cw { fill: #edf1fa; }
  .ln { stroke: #56607a; stroke-width: 1.6; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56607a"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138a5e"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9403f"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8f84"/></marker><marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fd1"/></marker></defs>
<text x="20" y="28" class="m b" style="fill:#2f6fd6;font-size:15px">ventas</text>
<rect x="100" y="10" width="68" height="34" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="134" y="32" class="m" text-anchor="middle">465</text>
<rect x="176" y="10" width="68" height="34" rx="8" fill="#ffe6e6" stroke="#c9403f" stroke-width="1.5"/>
<text x="210" y="32" class="m b" text-anchor="middle" style="fill:#c9403f">NA</text>
<rect x="252" y="10" width="68" height="34" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="286" y="32" class="m" text-anchor="middle">185</text>
<rect x="20" y="70" width="300" height="40" rx="8" fill="#111a30" stroke="#111a30" stroke-width="1.5"/>
<text x="36" y="95" class="m" style="fill:#edf1fa;font-size:12.5px">sum(ventas)</text>
<path d="M322 90 H 356" fill="none" stroke="#56607a" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="360" y="70" width="180" height="40" rx="8" fill="#ffe6e6" stroke="#c9403f" stroke-width="1.4"/>
<text x="450" y="95" class="m b" text-anchor="middle" style="fill:#c9403f;font-size:13px">NA</text>
<text x="556" y="95" class="s">el desconocido contagia el total</text>
<rect x="20" y="126" width="300" height="40" rx="8" fill="#111a30" stroke="#111a30" stroke-width="1.5"/>
<text x="36" y="151" class="m" style="fill:#edf1fa;font-size:12.5px">sum(ventas, na.rm = TRUE)</text>
<path d="M322 146 H 356" fill="none" stroke="#56607a" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="360" y="126" width="180" height="40" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.4"/>
<text x="450" y="151" class="m b" text-anchor="middle" style="fill:#138a5e;font-size:13px">650</text>
<text x="556" y="151" class="s">suma solo los valores conocidos</text>
<rect x="20" y="182" width="300" height="40" rx="8" fill="#111a30" stroke="#111a30" stroke-width="1.5"/>
<text x="36" y="207" class="m" style="fill:#edf1fa;font-size:12.5px">is.na(ventas)</text>
<path d="M322 202 H 356" fill="none" stroke="#56607a" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="360" y="182" width="180" height="40" rx="8" fill="#e3edff" stroke="#2f6fd6" stroke-width="1.4"/>
<text x="450" y="207" class="m b" text-anchor="middle" style="fill:#2f6fd6;font-size:13px">FALSE  TRUE  FALSE</text>
<text x="556" y="207" class="s">¿falta? posición por posición</text>
<rect x="20" y="238" width="300" height="40" rx="8" fill="#111a30" stroke="#111a30" stroke-width="1.5"/>
<text x="36" y="263" class="m" style="fill:#edf1fa;font-size:12.5px">sum(is.na(ventas))</text>
<path d="M322 258 H 356" fill="none" stroke="#56607a" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="360" y="238" width="180" height="40" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="450" y="263" class="m b" text-anchor="middle" style="fill:#b86e00;font-size:13px">1</text>
<text x="556" y="263" class="s">¿cuántos faltan?</text>
</svg>
