<text x="454" y="249" class="s" text-anchor="end">salida: se ejecuta y se olvida</text>
<text x="40" y="284" class="m" style="fill:#2f6fd6;font-size:12.5px">&gt; ingresos &lt;- c(4200, 4550, 4100, 4800)</text>
<text x="40" y="306" class="m" style="fill:#2f6fd6;font-size:12.5px">&gt; mean(ingresos)</text>
<text x="40" y="328" class="m" style="fill:#111a30;font-size:12.5px">[1] 4412.5</text>
<text x="40" y="350" class="m" style="fill:#2f6fd6;font-size:12.5px">&gt;</text>
