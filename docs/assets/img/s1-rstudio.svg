<text x="48.5" y="46" class="b" text-anchor="middle" style="fill:#ffffff;font-size:9px">R</text>
<text x="62" y="46" class="m" style="fill:#edf1fa;font-size:12px">ingresos.R</text>
<text x="454" y="44" class="s" text-anchor="end" style="fill:#aab4cc">Source (script)</text>
<text x="40" y="82" class="m" style="fill:#6d7896;font-size:12px">1</text>
<text x="64" y="82" class="m" style="fill:#8792ae;font-size:13px"># ingresos de enero a abril</text>
<text x="40" y="104" class="m" style="fill:#6d7896;font-size:12px">2</text>
<text x="64" y="104" class="m" style="fill:#edf1fa;font-size:13px">ingresos &lt;- c(4200, 4550, 4100, 4800)</text>
<text x="40" y="126" class="m" style="fill:#6d7896;font-size:12px">3</text>
<text x="64" y="126" class="m" style="fill:#edf1fa;font-size:13px">mean(ingresos)</text>
