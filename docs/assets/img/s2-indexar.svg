<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="El vector precios con los valores 10, 15, 20 y 35. Por posición, precios de c 1 y 3 da 10 y 20. Por exclusión, precios de menos 2 da 10, 20 y 35. Por condición, precios mayor que 15 produce la máscara FALSE, FALSE, TRUE, TRUE y solo pasan 20 y 35.">
<title>El vector precios con los valores 10, 15, 20 y 35. Por posición, precios de c 1 y 3 da 10 y 20. Por exclusión, precios de menos 2 da 10, 20 y 35. Por condición, precios mayor que 15 produce la máscara FALSE, FALSE, TRUE, TRUE y solo pasan 20 y 35.</title>
<style>
  text { font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', Arial, sans-serif; font-size: 14px; fill: #111a30; }
  .t { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 16px; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .s { font-size: 12px; fill: #56607a; }
  .b { font-weight: 700; }
  .w { fill: #ffffff; }
  .cw { fill: #edf1fa; }
  .ln { stroke: #56607a; stroke-width: 1.6; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56607a"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#138a5e"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9403f"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8f84"/></marker><marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fd1"/></marker></defs>
<text x="20" y="30" class="m b" style="fill:#2f6fd6;font-size:15px">precios</text>
<rect x="100" y="12" width="62" height="32" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="131" y="33" class="m" text-anchor="middle">10</text>
<text x="131" y="58" class="s" text-anchor="middle">[1]</text>
<rect x="170" y="12" width="62" height="32" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="201" y="33" class="m" text-anchor="middle">15</text>
<text x="201" y="58" class="s" text-anchor="middle">[2]</text>
<rect x="240" y="12" width="62" height="32" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="271" y="33" class="m" text-anchor="middle">20</text>
<text x="271" y="58" class="s" text-anchor="middle">[3]</text>
<rect x="310" y="12" width="62" height="32" rx="8" fill="#eef2fb" stroke="#2b3a5c" stroke-width="1.5"/>
<text x="341" y="33" class="m" text-anchor="middle">35</text>
<text x="341" y="58" class="s" text-anchor="middle">[4]</text>
<text x="20" y="100" class="t" style="font-size:14px;">Por posición</text>
<text x="20" y="120" class="m" style="fill:#56607a;font-size:12px">precios[c(1, 3)]</text>
<rect x="220" y="86" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="251" y="107" class="m" text-anchor="middle">10</text>
<rect x="290" y="86" width="62" height="32" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="321" y="107" class="m" text-anchor="middle" style="fill:#8792ae">15</text>
<rect x="360" y="86" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="391" y="107" class="m" text-anchor="middle">20</text>
<rect x="430" y="86" width="62" height="32" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="461" y="107" class="m" text-anchor="middle" style="fill:#8792ae">35</text>
<path d="M512 102 H 556" fill="none" stroke="#138a5e" stroke-width="1.8" marker-end="url(#pg)"/>
<rect x="566" y="86" width="174" height="32" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="653" y="107" class="m b" text-anchor="middle">10  20</text>
<text x="20" y="180" class="t" style="font-size:14px;">Por exclusión</text>
<text x="20" y="200" class="m" style="fill:#56607a;font-size:12px">precios[-2]</text>
<rect x="220" y="166" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="251" y="187" class="m" text-anchor="middle">10</text>
<rect x="290" y="166" width="62" height="32" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="321" y="187" class="m" text-anchor="middle" style="fill:#8792ae">15</text>
<rect x="360" y="166" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="391" y="187" class="m" text-anchor="middle">20</text>
<rect x="430" y="166" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="461" y="187" class="m" text-anchor="middle">35</text>
<path d="M512 182 H 556" fill="none" stroke="#138a5e" stroke-width="1.8" marker-end="url(#pg)"/>
<rect x="566" y="166" width="174" height="32" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="653" y="187" class="m b" text-anchor="middle">10  20  35</text>
<text x="20" y="260" class="t" style="font-size:14px;">Por condición</text>
<text x="20" y="280" class="m" style="fill:#56607a;font-size:12px">precios[precios &gt; 15]</text>
<rect x="220" y="246" width="62" height="32" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="251" y="267" class="m" text-anchor="middle" style="fill:#8792ae">10</text>
<text x="251" y="296" class="m" text-anchor="middle" style="fill:#c9403f;font-size:11px">FALSE</text>
<rect x="290" y="246" width="62" height="32" rx="8" fill="#ffffff" stroke="#c9d1e3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="321" y="267" class="m" text-anchor="middle" style="fill:#8792ae">15</text>
<text x="321" y="296" class="m" text-anchor="middle" style="fill:#c9403f;font-size:11px">FALSE</text>
<rect x="360" y="246" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="391" y="267" class="m" text-anchor="middle">20</text>
<text x="391" y="296" class="m" text-anchor="middle" style="fill:#138a5e;font-size:11px">TRUE</text>
<rect x="430" y="246" width="62" height="32" rx="8" fill="#dcf5ea" stroke="#138a5e" stroke-width="1.5"/>
<text x="461" y="267" class="m" text-anchor="middle">35</text>
<text x="461" y="296" class="m" text-anchor="middle" style="fill:#138a5e;font-size:11px">TRUE</text>
<path d="M512 262 H 556" fill="none" stroke="#138a5e" stroke-width="1.8" marker-end="url(#pg)"/>
<rect x="566" y="246" width="174" height="32" rx="8" fill="#fff0d6" stroke="#f5a623" stroke-width="1.4"/>
<text x="653" y="267" class="m b" text-anchor="middle">20  35</text>
<text x="380" y="318" class="s" text-anchor="middle">La máscara lógica tiene el mismo largo que el vector: solo cruzan las posiciones TRUE.</text>
</svg>
