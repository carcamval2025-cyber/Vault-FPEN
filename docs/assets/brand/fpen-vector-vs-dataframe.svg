<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="vdfTitle vdfDesc">
  <title id="vdfTitle">Vector Unidimensional vs. Data Frame Bidimensional en R</title>
  <desc id="vdfDesc">Comparación visual entre un vector atómico 1D y un Data Frame 2D formado por columnas-vectores de igual longitud y tipos variados.</desc>

  <defs>
    <!-- Background subtle grid pattern -->
    <pattern id="grid-pattern-vdf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4c9aff" stroke-width="1" stroke-opacity="0.035" />
    </pattern>

    <!-- Panel Gradients -->
    <linearGradient id="panel-vdf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182645" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111a30" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cell-num-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243356" />
      <stop offset="100%" stop-color="#16223b" />
    </linearGradient>

    <linearGradient id="arrow-vdf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c9aff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4c9aff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="960" height="640" fill="#0a0f1c" />
  <rect width="960" height="640" fill="url(#grid-pattern-vdf)" />

  <!-- Top Title & Badge -->
  <g transform="translate(60, 42)">
    <rect width="210" height="26" rx="13" fill="#111a30" stroke="#4c9aff" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4" fill="#4c9aff" />
    <text x="32" y="17" fill="#4c9aff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5">ESTRUCTURA DE DATOS</text>
    <text x="0" y="58" fill="#edf1fa" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700">De Vectores 1D a Data Frames 2D</text>
    <text x="0" y="82" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="13">Una tabla en R es una colección de vectores alineados por columnas de igual longitud</text>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT PANEL: VECTOR 1D                                          -->
  <!-- ============================================================== -->
  <g transform="translate(60, 150)">
    <!-- Container -->
    <rect width="360" height="440" rx="16" fill="url(#panel-vdf-grad)" stroke="#4c9aff" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Panel Header -->
    <rect x="20" y="20" width="120" height="24" rx="12" fill="rgba(76,154,255,0.12)" stroke="#4c9aff" stroke-opacity="0.4" stroke-width="1" />
    <text x="80" y="36" fill="#4c9aff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">VECTOR (1D)</text>
    
    <text x="20" y="70" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">
      <tspan fill="#4c9aff">ingresos</tspan> <tspan fill="#2dd4bf">&lt;-</tspan> <tspan fill="#4c9aff">c</tspan>(<tspan fill="#f5a623">2400</tspan>, <tspan fill="#f5a623">3100</tspan>, <tspan fill="#f5a623">1850</tspan>, <tspan fill="#f5a623">4200</tspan>)
    </text>

    <!-- Vector Boxes (Vertical stack representing 1 column) -->
    <g transform="translate(60, 95)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="240" height="52" rx="8" fill="url(#cell-num-grad)" stroke="#4c9aff" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="24" y="32" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">[1]</text>
      <text x="140" y="33" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle">2400</text>
      <text x="220" y="32" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">&lt;dbl&gt;</text>

      <!-- Box 2 -->
      <rect x="0" y="62" width="240" height="52" rx="8" fill="url(#cell-num-grad)" stroke="#4c9aff" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="24" y="94" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">[2]</text>
      <text x="140" y="95" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle">3100</text>
      <text x="220" y="94" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">&lt;dbl&gt;</text>

      <!-- Box 3 -->
      <rect x="0" y="124" width="240" height="52" rx="8" fill="url(#cell-num-grad)" stroke="#4c9aff" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="24" y="156" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">[3]</text>
      <text x="140" y="157" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle">1850</text>
      <text x="220" y="156" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">&lt;dbl&gt;</text>

      <!-- Box 4 -->
      <rect x="0" y="186" width="240" height="52" rx="8" fill="url(#cell-num-grad)" stroke="#4c9aff" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="24" y="218" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">[4]</text>
      <text x="140" y="219" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle">4200</text>
      <text x="220" y="218" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">&lt;dbl&gt;</text>
    </g>

    <!-- Properties footer -->
    <g transform="translate(20, 355)">
      <line x1="0" y1="0" x2="320" y2="0" stroke="#4c9aff" stroke-opacity="0.15" stroke-width="1" />
      <text x="0" y="22" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#edf1fa">dim(ingresos)</tspan> → <tspan fill="#ff6b6b">NULL</tspan> (sin dimensiones 2D)
      </text>
      <text x="0" y="44" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#edf1fa">length(ingresos)</tspan> → <tspan fill="#2dd4bf">4 elementos</tspan>
      </text>
      <text x="0" y="66" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#amber">Homogéneo</tspan>: 100% mismo tipo de dato
      </text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- CENTER CONNECTOR / BRIDGE                                      -->
  <!-- ============================================================== -->
  <g transform="translate(435, 330)">
    <path d="M 0 0 L 70 0" stroke="url(#arrow-vdf)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
    <polygon points="75,0 65,-6 65,6" fill="#2dd4bf" />
    <rect x="5" y="-35" width="65" height="22" rx="6" fill="#111a30" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1" />
    <text x="37" y="-20" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">bind</text>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT PANEL: DATA FRAME (2D)                                   -->
  <!-- ============================================================== -->
  <g transform="translate(520, 150)">
    <!-- Container -->
    <rect width="380" height="440" rx="16" fill="url(#panel-vdf-grad)" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Panel Header -->
    <rect x="20" y="20" width="145" height="24" rx="12" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1" />
    <text x="92" y="36" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">DATA FRAME (2D)</text>

    <text x="20" y="70" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">
      <tspan fill="#2dd4bf">df</tspan> <tspan fill="#4c9aff">&lt;-</tspan> <tspan fill="#2dd4bf">tibble</tspan>(<tspan fill="#34d399">sector</tspan>, <tspan fill="#4c9aff">ingresos</tspan>, <tspan fill="#a78bfa">activo</tspan>)
    </text>

    <!-- Table Grid Representation -->
    <g transform="translate(20, 95)">
      <!-- Table Header Row -->
      <g>
        <!-- Col 1 Header -->
        <rect x="35" y="0" width="95" height="30" rx="6" fill="#1b2e2b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text x="82" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">sector</text>
        <text x="82" y="27" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">&lt;chr&gt;</text>

        <!-- Col 2 Header -->
        <rect x="135" y="0" width="95" height="30" rx="6" fill="#1b2844" stroke="#4c9aff" stroke-opacity="0.6" stroke-width="1.5" />
        <text x="182" y="16" fill="#4c9aff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ingresos</text>
        <text x="182" y="27" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">&lt;dbl&gt;</text>

        <!-- Col 3 Header -->
        <rect x="235" y="0" width="95" height="30" rx="6" fill="#281c3c" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1" />
        <text x="282" y="16" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">activo</text>
        <text x="282" y="27" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">&lt;lgl&gt;</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(0, 38)">
        <text x="15" y="26" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="11">[1,]</text>
        <rect x="35" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="82" y="27" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"Agro"</text>

        <rect x="135" y="6" width="95" height="34" rx="5" fill="#182b4a" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="182" y="27" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">2400</text>

        <rect x="235" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="282" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">TRUE</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 80)">
        <text x="15" y="26" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="11">[2,]</text>
        <rect x="35" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="82" y="27" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"Comercio"</text>

        <rect x="135" y="6" width="95" height="34" rx="5" fill="#182b4a" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="182" y="27" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">3100</text>

        <rect x="235" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="282" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">TRUE</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 122)">
        <text x="15" y="26" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="11">[3,]</text>
        <rect x="35" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="82" y="27" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"Servicio"</text>

        <rect x="135" y="6" width="95" height="34" rx="5" fill="#182b4a" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="182" y="27" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">1850</text>

        <rect x="235" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="282" y="27" fill="#ff6b6b" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">FALSE</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 164)">
        <text x="15" y="26" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="11">[4,]</text>
        <rect x="35" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="82" y="27" fill="#edf1fa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"Banca"</text>

        <rect x="135" y="6" width="95" height="34" rx="5" fill="#182b4a" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="182" y="27" fill="#f5a623" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">4200</text>

        <rect x="235" y="6" width="95" height="34" rx="5" fill="#132034" stroke="rgba(237,241,250,0.08)" stroke-width="1" />
        <text x="282" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">TRUE</text>
      </g>

      <!-- Extraction indicator on column 2: df$ingresos -->
      <path d="M 182 215 L 182 235" stroke="#4c9aff" stroke-width="1.5" stroke-dasharray="3 3" />
      <rect x="125" y="238" width="115" height="20" rx="5" fill="#111a30" stroke="#4c9aff" stroke-width="1" />
      <text x="182" y="252" fill="#4c9aff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">df$ingresos</text>
    </g>

    <!-- Properties footer -->
    <g transform="translate(20, 355)">
      <line x1="0" y1="0" x2="340" y2="0" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="1" />
      <text x="0" y="22" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#edf1fa">dim(df)</tspan> → <tspan fill="#2dd4bf">[4 filas × 3 columnas]</tspan>
      </text>
      <text x="0" y="44" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#edf1fa">nrow(df) = 4</tspan> | <tspan fill="#edf1fa">ncol(df) = 3</tspan>
      </text>
      <text x="0" y="66" fill="#8792ae" font-family="'JetBrains Mono', monospace" font-size="12">
        • <tspan fill="#2dd4bf">Heterogéneo por col.</tspan>: cada col. tiene su propio tipo
      </text>
    </g>
  </g>
</svg>
