<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="v1title v1desc">
  <title id="v1title">Concepto de Vector — Fila de Cajas en R</title>
  <desc id="v1desc">Cuatro cajas contiguas del mismo tamaño y tono azul con valores numéricos mensuales, unidas como un solo objeto vector.</desc>
  
  <defs>
    <!-- Background subtle grid pattern -->
    <pattern id="grid-pattern-v1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4c9aff" stroke-width="1" stroke-opacity="0.035" />
    </pattern>

    <!-- Linear Gradient for Vector Boxes (Same tone base with subtle depth) -->
    <linearGradient id="vbox-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182645" />
      <stop offset="100%" stop-color="#111a30" />
    </linearGradient>
  </defs>

  <!-- 1. Background Base -->
  <rect width="960" height="640" fill="#0a0f1c" />
  <rect width="960" height="640" fill="url(#grid-pattern-v1)" />

  <!-- 2. Subtle Reference Guides (Centered) -->
  <g fill="none" stroke-linecap="round">
    <line x1="120" y1="275" x2="840" y2="275" stroke="#4c9aff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- ============================================================== -->
  <!-- 3. TOP OBJECT DECLARATION PILL                                 -->
  <!-- ============================================================== -->
  <g transform="translate(320, 100)">
    <rect width="320" height="38" rx="8" fill="#111a30" stroke="#4c9aff" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="160" y="24" fill="#8792ae" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="600" text-anchor="middle">
      <tspan fill="#4c9aff" font-weight="700">ingresos</tspan> <tspan fill="#2dd4bf">&lt;-</tspan> <tspan fill="#4c9aff">c</tspan>(<tspan fill="#edf1fa">4200, 4550, 4100, 4800</tspan>)
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 4. OUTER DASHED ENCLOSURE (UN SOLO OBJETO)                     -->
  <!-- ============================================================== -->
  <g transform="translate(170, 175)">
    <!-- Dashed perimeter wrapping all 4 boxes -->
    <rect width="620" height="230" rx="20" fill="#111a30" fill-opacity="0.35" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 8" />
    
    <!-- Bottom Identification Badge -->
    <g transform="translate(180, 212)">
      <rect width="260" height="36" rx="8" fill="#0a0f1c" stroke="#4c9aff" stroke-width="1.5" />
      <circle cx="20" cy="18" r="4" fill="#4c9aff" />
      <text x="140" y="23" fill="#4c9aff" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">un solo objeto: ingresos</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 5. FOUR IDENTICAL BOXES (124x124) + CONNECTORS                -->
  <!-- Centered horizontally: total width = 556, x_start = 202        -->
  <!-- ============================================================== -->

  <!-- Inter-box Connecting Links (Wagon connectors) -->
  <g fill="#182645" stroke="#4c9aff" stroke-opacity="0.5" stroke-width="1.5">
    <rect x="326" y="270" width="20" height="10" rx="2" />
    <line x1="326" y1="275" x2="346" y2="275" stroke="#4c9aff" stroke-width="2" />

    <rect x="470" y="270" width="20" height="10" rx="2" />
    <line x1="470" y1="275" x2="490" y2="275" stroke="#4c9aff" stroke-width="2" />

    <rect x="614" y="270" width="20" height="10" rx="2" />
    <line x1="614" y1="275" x2="634" y2="275" stroke="#4c9aff" stroke-width="2" />
  </g>

  <!-- BOX 1: Index [1] -> 4200 -->
  <g transform="translate(202, 213)">
    <!-- Box Body -->
    <rect width="124" height="124" rx="16" fill="url(#vbox-grad)" stroke="#4c9aff" stroke-width="2" />
    <!-- Top subtle accent bar -->
    <rect x="4" y="3" width="116" height="4" rx="2" fill="#4c9aff" />
    <!-- Index Subscript -->
    <text x="14" y="26" fill="#8792ae" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600">[1]</text>
    <!-- Value -->
    <text x="62" y="74" fill="#edf1fa" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="-0.5">4200</text>
  </g>

  <!-- BOX 2: Index [2] -> 4550 -->
  <g transform="translate(346, 213)">
    <!-- Box Body -->
    <rect width="124" height="124" rx="16" fill="url(#vbox-grad)" stroke="#4c9aff" stroke-width="2" />
    <!-- Top subtle accent bar -->
    <rect x="4" y="3" width="116" height="4" rx="2" fill="#4c9aff" />
    <!-- Index Subscript -->
    <text x="14" y="26" fill="#8792ae" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600">[2]</text>
    <!-- Value -->
    <text x="62" y="74" fill="#edf1fa" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="-0.5">4550</text>
  </g>

  <!-- BOX 3: Index [3] -> 4100 -->
  <g transform="translate(490, 213)">
    <!-- Box Body -->
    <rect width="124" height="124" rx="16" fill="url(#vbox-grad)" stroke="#4c9aff" stroke-width="2" />
    <!-- Top subtle accent bar -->
    <rect x="4" y="3" width="116" height="4" rx="2" fill="#4c9aff" />
    <!-- Index Subscript -->
    <text x="14" y="26" fill="#8792ae" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600">[3]</text>
    <!-- Value -->
    <text x="62" y="74" fill="#edf1fa" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="-0.5">4100</text>
  </g>

  <!-- BOX 4: Index [4] -> 4800 -->
  <g transform="translate(634, 213)">
    <!-- Box Body -->
    <rect width="124" height="124" rx="16" fill="url(#vbox-grad)" stroke="#4c9aff" stroke-width="2" />
    <!-- Top subtle accent bar -->
    <rect x="4" y="3" width="116" height="4" rx="2" fill="#4c9aff" />
    <!-- Index Subscript -->
    <text x="14" y="26" fill="#8792ae" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600">[4]</text>
    <!-- Value -->
    <text x="62" y="74" fill="#edf1fa" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="-0.5">4800</text>
  </g>

</svg>
